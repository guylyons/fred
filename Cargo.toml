[package]
name = "fred"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ignore = "0.4"
libghostty-vt = { version = "0.2.2", optional = true }
libc = "0.2"
nucleo-matcher = "0.3"
portable-pty = { version = "0.9", optional = true }
ratatui = "0.30"
libloading = "0.8"
regex = "1"
ropey = { version = "1", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
similar = "2"
syntect = { version = "5", default-features = false, features = ["default-themes", "regex-onig", "plist-load"] }
toml = "0.9"
tree-sitter = "0.27"
tree-sitter-language = "0.1"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dockerfile-updated = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"
two-face = "0.5"
unicode-segmentation = "1"
unicode-width = "0.2"
figlet-rs = "1.0.0"

[features]
# `:terminal`: Ghostty's terminal emulator in fred. Building it needs Zig 0.15.
ghostty = ["dep:libghostty-vt", "dep:portable-pty"]

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
vt100 = "0.16"

[profile.release]
strip = true
lto = true
codegen-units = 1
