[package]
name = "fred"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ignore = "0.4"
libc = "0.2"
nucleo-matcher = "0.3"
ratatui = "0.30"
regex = "1"
ropey = { version = "1", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
similar = "2"
syntect = "5"
toml = "0.9"
two-face = "0.5"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"
vt100 = "0.16"
